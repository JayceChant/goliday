# 注意：本文件为假设示例方案，并非官方发布，仅供测试使用。
# 稀疏表原则：只记录被"调整过"的日期——off 仅含周一~周五（工作日变休息，含节日当天与调休日），
# work 仅含周六/周日（周末变上班）；假期中的自然周末日一律不写入。
# [[festival]] 仅含 name 与节日当天 date。
# 供其他任务测试引用的关键约定：
#   2026-02-20（周五）→ 调休 off（AdjustedRestDay = 10）；
#   2026-02-17（周二）→ 春节当天且在 off（FestivalRest = 6）；
#   2026-02-28（周六）→ 补班 work（AdjustedWorkDay = 17）；
#   2026-04-05（周日）→ 清明节日当天、不在 off/work（FestivalRest = 6）；
#   2026-03-03（周二）→ 未覆盖普通工作日（Work = 1）。

