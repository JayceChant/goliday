# 持续集成：将本地验证门禁（build/vet/gofmt/test/lint/proto）搬上 GitHub Actions：
# - Go 1.27.x（go.mod 最低要求）/stable 双版本矩阵运行测试并生成覆盖率
# - stable 矩阵项上报覆盖率至 Codecov（公共仓库无 token 亦可上传，失败不阻塞）
# - golangci-lint 零告警门禁（配置见 .golangci.yml）
# - 触发不限定 master：门禁类工作流随分支推送与 PR 全量执行，开发分支
#   合入 master 前即可确认质量（公共仓库 Actions 免费，concurrency 去重）
name: ci

on:
  push:
    # 所有分支（"**" 匹配含斜杠的分支名，且排除 tag 推送）：无需先合入
    # 或开 PR 即可在开发分支上执行门禁
    branches: ["**"]
  pull_request:
    # 不设目标分支过滤：叠加 PR（指向非 master 分支）与 release-please
    # Release PR 同样接受门禁检查
  workflow_dispatch:

# 冗余抑制：同一分支的 push 与 pull_request 双事件共享并发组（PR 的
# head_ref 与分支推送的 ref_name 同名），cancel-in-progress 仅保留最新
# 一次运行，双事件不重复执行
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x", stable]
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        # -race 检测数据竞争；store/calendar 读多写少，CI 顺带验证并发安全
        run: go test -count=1 -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Fuzz smoke test
        # 普通测试仅跑种子语料；对全部 5 个 fuzz 目标（FuzzParseDate/
        # FuzzQueryConsistency/FuzzLoadYearTOML/FuzzDaysHandler/FuzzGenDraft）
        # 逐目标做短时真实 fuzz，挖掘种子外的崩溃。仅 stable 矩阵项执行，
        # 失败即门禁失败。
        if: matrix.go == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          set -e
          fuzz_one() { go test -run '^$' -fuzz "^$1\$" -fuzztime 30s -count=1 "$2"; }
          fuzz_one FuzzParseDate .
          fuzz_one FuzzQueryConsistency .
          fuzz_one FuzzLoadYearTOML .
          fuzz_one FuzzDaysHandler ./cmd/goliday-server
          fuzz_one FuzzGenDraft ./cmd/goliday-tool

      - name: Filter coverage profile
        # proto/goliday/v1 为 buf 生成的桩代码，不设测试目标（与 codecov.yml
        # 的 ignore 及 .golangci.yml 的 generated 豁免同一口径）：从覆盖率
        # 剖析中剔除，避免零覆盖的生成代码拉低整体统计。
        run: |
          grep -v '^github.com/JayceChant/goliday/proto/' coverage.out > coverage.filtered.out
          mv coverage.filtered.out coverage.out
          grep -c 'proto/' coverage.out && exit 1 || true

      - name: Upload coverage to Codecov
        if: matrix.go == 'stable' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # 与 .golangci.yml（version: "2"）匹配的 v2.x
          version: v2.13

  proto:
    name: proto (buf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install buf and protoc plugins
        # 工具依赖经 go.mod tool 指令 + go.sum 锁定（版本校验和一并入库），
        # `go install tool` 按 lock 文件安装，满足依赖可预测性；版本与
        # buf.gen.yaml 及 proto 头注释的参考版本一致（buf v1.72.0、
        # protoc-gen-go v1.36.12、protoc-gen-go-grpc v1.5.1）。
        run: go install tool

      - name: buf lint
        run: buf lint

      - name: buf breaking (vs master)
        # PR 上对照远端 master 做破坏性变更检查（FILE 级，配置见 buf.yaml）；
        # 公共仓库可匿名拉取对照目标。master push 事件对照自身无意义，跳过。
        if: github.event_name == 'pull_request'
        run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=master,subdir=proto'

      - name: Regenerated code consistency
        # 入库的生成代码须与 proto 当前内容一致：重新生成后工作区不得有差异
        run: |
          buf generate
          git diff --exit-code -- proto/
