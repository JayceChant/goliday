# ============================================================
# 节假日配置文件示例（以 testdata/2026.toml 为基础）
# ============================================================
#
# 本文件演示按年一份的 TOML 配置格式（此处为 2026 年假设示例，非官方方案）。
#
# 【核心：稀疏表原则】
# 配置只记录节假日办"调整过"的日期，未被调整的日期一律不写入：
#   1. off（变休息）：仅允许写周一~周五的工作日，包括
#      - 法定节假日当天（若当天是工作日）；
#      - 为拼出长假而前后调休的工作日。
#   2. work（变上班）：仅允许写周六/周日，即被"征用"来补班的周末。
#   3. 假期中的自然周末日（周六/周日）一律不写入：它们本来就是休息日，
#      不属于"调整"，由程序按星期自然推导为休息日。
#   4. 普通工作日（周一~周五且未被调整）不写入，按星期推导为工作日。
#
# 【[[festival]] 的用途】
# 仅记录节日名称与节日当天日期（YYYY-MM-DD），用于回答"这一天是什么节"。
# 节日当天若是周末，只写入 festival、不写入 off（见下方"不写入示例"）；
# 若是周一~周五，则必须同时出现在 off 中（节日当天为工作日必放假）。
#
# 【不写入示例（以 2026 年为例）】
#   - 2026-04-05（周日，清明当天）：只出现在 festival 中，不写 off/work。
#     因为周日本就是休息日，不需要"调整为休息"。
#   - 2026-01-03（周六）、2026-01-04（周日）：元旦假期中的自然周末，
#     不属于调整，不写入任何字段。
#   - 2026-02-21（周六）、2026-02-22（周日）：春节假期中的自然周末，
#     同理不写入。
#   - 2026-03-03（周二）：普通工作日，未覆盖，不写入。
#
# 【关键日期语义示例（供测试与校验引用）】
#   - 2026-02-17（周二）：春节当天且在 off → Festival|Adjusted（节日且被调整）。
#   - 2026-02-20（周五）：调休休息日 → 仅 Adjusted。
#   - 2026-02-28（周六）：补班日 → Compensate|Weekend（周末变上班）。
#   - 2026-04-05（周日）：清明当天、不在 off/work → Festival|Weekend。

year = 2026

# ---------- festival：节日名与节日当天 ----------
# 每个条目仅含两个字段：name（节日名称）与 date（节日当天，YYYY-MM-DD）。
# 注意：春节只记正月初一当天，不记除夕或整个假期区间；
# 中秋节与国庆节相邻时也各自单独记录。

[[festival]]
name = "元旦"
date = "2026-01-01"

[[festival]]
name = "春节"
date = "2026-02-17"

[[festival]]
name = "清明节"
date = "2026-04-05"

[[festival]]
name = "劳动节"
date = "2026-05-01"

[[festival]]
name = "端午节"
date = "2026-06-19"

[[festival]]
name = "中秋节"
date = "2026-09-25"

[[festival]]
name = "国庆节"
date = "2026-10-01"

# ---------- adjust：调整表 ----------
# off = 工作日变休息（仅周一~周五）：
#   - 2026-01-01/01-02：元旦假期中的周四、周五；
#     紧随其后的 01-03（周六）、01-04（周日）是自然周末，不写入。
#   - 2026-02-16~02-20：春节假期（周一至周五），其中 02-17 为节日当天，
#     02-16 为调休；假期中的 02-21（周六）、02-22（周日）不写入。
#   - 2026-04-06：清明调休（周一）。清明当天 04-05 是周日，
#     故 festival 有它、off 没有。
#   - 2026-05-01（周五，节日当天）、05-04、05-05（周一、周二调休）；
#     05-02（周六）、05-03（周日）为自然周末，不写入。
#   - 2026-06-19（周五，端午当天）；06-20（周六）、06-21（周日）不写入。
#   - 2026-09-25（周五，中秋当天）；09-26（周六）、09-27（周日）不写入。
#   - 2026-10-01（周四，国庆当天）、10-02（周五）、10-05~10-08
#     （周一~周四调休）；10-03（周六）、10-04（周日）不写入。
#
# work = 周末变上班（仅周六/周日）：
#   - 2026-02-14（周六）、2026-02-28（周六）：为春节长假补班；
#   - 2026-05-09（周六）：为劳动节调休补班；
#   - 2026-10-10（周六）、2026-10-11（周日）：为国庆长假补班。

[adjust]
off = [
  "2026-01-01", "2026-01-02",
  "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", "2026-02-20",
  "2026-04-06",
  "2026-05-01", "2026-05-04", "2026-05-05",
  "2026-06-19",
  "2026-09-25",
  "2026-10-01", "2026-10-02", "2026-10-05", "2026-10-06", "2026-10-07", "2026-10-08",
]
work = [ "2026-02-14", "2026-02-28", "2026-05-09", "2026-10-10", "2026-10-11" ]
