# SonarCloud 项目参数：由 .github/workflows/sonarcloud.yml 的扫描步骤读取
# projectKey/organization 以 SonarCloud 控制台实际绑定结果为准
sonar.projectKey=JayceChant_goliday
sonar.organization=jaycechant

# 源码与测试目录（Go 项目通用配法：全仓扫描，测试经 inclusions 归类）
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# 测试文件不计入主源码
sonar.exclusions=**/*_test.go,proto/**

# 覆盖率文件由 workflow 中 go test -covermode=atomic 生成
sonar.go.coverage.reportPaths=coverage.txt
# proto/ 为 buf 生成桩代码，不设测试目标（与 .golangci.yml、codecov.yml 同一口径）
sonar.coverage.exclusions=proto/**
